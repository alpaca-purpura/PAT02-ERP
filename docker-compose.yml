version: '3.8'

services:
  db:
    image: postgres:15
    container_name: odoo-patco-db
    environment:
      - POSTGRES_DB=odoo_patco
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=P4tc0_2
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    networks:
      - odoo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_patco"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo-patco-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    command: ["python3", "/opt/odoo/odoo-bin", "-c", "/etc/odoo/odoo.conf", "-i", "base"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped
    networks:
      - odoo-network

volumes:
  odoo-web-data:
    name: odoo-patco-web-data
  odoo-db-data:
    name: odoo-patco-db-data

networks:
  odoo-network:
    name: odoo-patco-network
    driver: bridge
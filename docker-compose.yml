version: '3.8'

services:
  db:
    image: postgres:15
    container_name: odoo-patco-db
    environment:
      - POSTGRES_DB=odoo_patco
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=P4tc0_2
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    networks:
      - odoo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_patco"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo-patco-app
    depends_on:
      db:
        condition: service_healthy
    command: ["python3", "/opt/odoo/odoo-bin", "-c", "/etc/odoo/odoo.conf", "--init=l10n_pe", "--load-language=es_PE", "--without-demo=all"]    
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - ODOO_RC=/etc/odoo/odoo.conf
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./extra-addons:/mnt/extra-addons
    restart: unless-stopped
    networks:
      - odoo-network
      - web_gateway
    labels:
      - "traefik.enable=true"
      # --- ROUTER SEGURO PARA ODOO ---
      - "traefik.docker.network=web_gateway"
      - "traefik.http.routers.odoo.rule=Host(`erp.andessuyo.com`)"
      - "traefik.http.routers.odoo.entrypoints=websecure"
      - "traefik.http.routers.odoo.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.odoo.service=odoo"
      # --- MIDDLEWARE PARA ODOO (OPCIONAL PERO RECOMENDADO) ---
      - "traefik.http.routers.odoo.middlewares=odoo-headers"
      - "traefik.http.middlewares.odoo-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      # --- SERVICIO DE ODOO ---
      - "traefik.http.services.odoo.loadbalancer.server.port=8069"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069/web/static/src/css/bootstrap.css || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  odoo-web-data:
    name: odoo-patco-web-data
  odoo-db-data:
    name: odoo-patco-db-data

networks:
  odoo-network:
    name: odoo-patco-network
    driver: bridge
  web_gateway:
    external: true
[tool:pytest]
# Configuración de pytest para tests de PATCO ERP

# Directorios de tests
testpaths = tests

# Patrones de archivos de test
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    compatibility: Tests de compatibilidad entre módulos
    regression: Tests de regresión funcional
    performance: Tests de rendimiento
    critical: Tests críticos que deben pasar
    slow: Tests que tardan más de 30 segundos
    integration: Tests de integración con servicios externos
    unit: Tests unitarios
    smoke: Tests básicos de funcionalidad
    database: Tests que requieren acceso a base de datos
    api: Tests de API REST
    ui: Tests de interfaz de usuario

# Opciones por defecto
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=10
    --durations=10
    --color=yes
    --disable-warnings
    --cov-report=term-missing
    --cov-report=html:tests/results/coverage_html
    --cov-report=xml:tests/results/coverage.xml
    --junitxml=tests/results/junit.xml

# Filtros de warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*imp module.*:DeprecationWarning
    ignore:.*distutils.*:DeprecationWarning

# Configuración de cobertura
# (se complementa con .coveragerc)

# Timeout para tests lentos (en segundos)
timeout = 300

# Configuración de logging durante tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Archivos de log durante tests
log_file = tests/results/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Configuración para tests en paralelo (si se usa pytest-xdist)
# addopts = ... -n auto

# Configuración para tests de base de datos
# Requiere pytest-postgresql o similar
# postgresql_proc_port = 5433
# postgresql_proc_unixsocketdir = /tmp

# Configuración para tests de Odoo
# Variables de entorno específicas para Odoo
env =
    ODOO_RC = config/odoo.conf
    PYTHONPATH = .:extra-addons
    ODOO_ADDONS_PATH = extra-addons,addons
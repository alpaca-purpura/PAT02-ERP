[options]
; Configuración básica de Odoo para PACIFIC ALLIANCE TRADING COMPANY SAC

; Configuración de base de datos
db_host = db
db_port = 5432
db_user = odoo
db_password = P4tc0_2
db_name = odoo_patco

; Configuración de servidor
xmlrpc_port = 8069
logfile = /var/log/odoo/odoo.log
log_level = debug

; Configuración de logging detallado para módulos PATCO y OCA
log_handler = :DEBUG,odoo.addons.patco_core:DEBUG,odoo.addons.patco_customer_equipment:DEBUG,odoo.addons.patco_hr_skills:DEBUG,odoo.addons.patco_suite:DEBUG,odoo.addons.fieldservice:DEBUG,odoo.addons.maintenance:DEBUG,odoo.addons.helpdesk:DEBUG,odoo.addons.agreement:DEBUG,odoo.addons.fieldservice_skill:DEBUG,odoo.addons.fieldservice_account:DEBUG,odoo.addons.fieldservice_maintenance:DEBUG,odoo.addons.fieldservice_helpdesk:DEBUG,odoo.addons.fieldservice_agreement:DEBUG,odoo.addons.fieldservice_stock:DEBUG,odoo.addons.fieldservice_sale:DEBUG,odoo.addons.fieldservice_purchase:DEBUG

; Formato de logs con timestamps y módulos
log_db = False
logrotate = True

; Configuración de addons
addons_path = /opt/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/OCA/web,/mnt/extra-addons/OCA/account-payment,/mnt/extra-addons/OCA/maintenance,/mnt/extra-addons/OCA/project,/mnt/extra-addons/OCA/reporting-engine,/mnt/extra-addons/OCA/server-env,/mnt/extra-addons/OCA/hr,/mnt/extra-addons/OCA/field-service,/mnt/extra-addons/OCA/partner-contact,/mnt/extra-addons/OCA/helpdesk,/mnt/extra-addons/OCA/agreement,/mnt/extra-addons/OCA/mail,/mnt/extra-addons/OCA/server-brand,/mnt/extra-addons/OCA/server-tool,/mnt/extra-addons/onlyoffice-odoo-18

; Configuración de seguridad
admin_passwd = P4tc0_2

; Configuración de workers (para producción y websockets)
workers = 2
max_cron_threads = 1
; SOLUCIÓN DEFINITIVA: Usar longpolling_port en lugar de gevent_port
longpolling_port = 8072
; Configuración crítica para websockets en Docker - CAUSA RAÍZ ENCONTRADA
xmlrpc_interface = 0.0.0.0
netrpc_interface = 0.0.0.0

; Configuración de límites
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; Configuración de timeout de base de datos para evitar locks
db_maxconn = 64
db_template = template0

; Configuración de proxy (si se usa)
proxy_mode = True

; Configuración de desarrollo
; dev_mode = reload,qweb,werkzeug,xml

; --- Configuración de Inicialización ---
; --- without_demo = all